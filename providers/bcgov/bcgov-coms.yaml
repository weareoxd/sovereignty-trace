id: bcgov-coms
name: BC Government Common Object Management Service / Object Storage
status: UNVERIFIED
description: >
  BC Government S3-compatible object storage, reached either through the
  Common Object Management Service (COMS) API or directly against the
  government object-store endpoint. The storage behind it is branded
  ObjectScale in some environments and is MinIO-compatible; applications
  usually talk to it with an S3 SDK pointed at a government endpoint rather
  than at AWS.

access_paths:
  - key: coms_api
    label: COMS API
    signatures:
      domains: [nrs.objectstore.gov.bc.ca]
    data_residency:
      customer_configurable: unknown
      configured_region_derivable_from_repository: false
      configured_region_reason: Not established from the sources used for this entry.
      storage_regions:
        status: unknown
        reason: Not established from the public sources used for this entry.
      processing_regions:
        status: unknown
        reason: Not established from the public sources used for this entry.
      support_access_regions:
        status: unknown
        reason: Not established from the public sources used for this entry.
    notes: >
      The COMS application itself may be self-hosted with an
      application-specific route. This path covers the documented BC
      Government object-store endpoint COMS is backed by.
    evidence:
      - url: https://github.com/bcgov/common-object-management-service/blob/master/app/README.md
        checked: "2026-08-26"

  - key: direct_s3
    label: Direct S3 endpoint (ObjectScale / MinIO)
    signatures:
      domains:
        - commonservices.objectstore.gov.bc.ca
        - "*.objectstore.gov.bc.ca"
      env_vars: [S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]
    data_residency:
      customer_configurable: unknown
      configured_region_derivable_from_repository: false
      configured_region_reason: >
        The endpoint hostname establishes that the destination is BC
        Government object storage rather than AWS, but the region string
        alongside it (commonly ca-central-1) is an S3 API parameter the
        client sends, not published evidence of where the government
        operates the store. Treat the region value as unconfirmed.
      storage_regions:
        status: unknown
        reason: >
          Not established from the public sources used for this entry. The
          ca-central-1 value seen in application configuration is an
          S3-protocol requirement, not a residency statement.
      processing_regions:
        status: unknown
        reason: Not established from the public sources used for this entry.
      support_access_regions:
        status: unknown
        reason: Not established from the public sources used for this entry.
    notes: >
      Applications reach this endpoint with an ordinary AWS S3 SDK
      (@aws-sdk/client-s3, boto3) configured with a custom `endpoint` and
      usually `forcePathStyle: true`. The SDK is Amazon's; the destination
      is not. Match this record, not `aws`.

what_to_look_for:
  - "An S3 client constructed with an explicit endpoint on *.objectstore.gov.bc.ca is this record, even though the SDK package is @aws-sdk/client-s3 or boto3. The endpoint, not the SDK, names the destination."
  - "\"ObjectScale\", \"MinIO\", or \"S3-compatible\" in BC Government configuration or Helm values usually means this service rather than a self-hosted store; check whether an endpoint hostname is set before treating it as in-cluster."

notes: >
  A region value of ca-central-1 in configuration does not by itself
  establish Canadian storage here. That string is required by the S3
  protocol and is often copied verbatim into non-AWS S3-compatible clients,
  so it says what the client sends, not where the bytes rest.

headquarters_country: CA
legal_entities:
  - name: Government of British Columbia
    role: contracting_entity
    jurisdiction: CA

metadata:
  last_verified: "2026-08-26"
evidence:
  - url: https://github.com/bcgov/pubcode/blob/main/schema/bcgovpubcode.json
    checked: "2026-08-26"
