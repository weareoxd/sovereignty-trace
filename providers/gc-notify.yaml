      processing_regions:
        status: unknown
        reason: Not established from the sources used for this entry.
    evidence:
      - url: https://documentation.notification.canada.ca/en/start.html
        checked: "2026-08-26"

notes: >
  Government-operated destination. Do not assume Canadian operation alone
